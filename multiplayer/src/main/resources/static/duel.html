<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>铁境竞技场 · 联机对战</title>
  <link rel="icon" href="icons/swords.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="board.css">
  <link rel="stylesheet" href="duel.css">
  <script src="duel.js" defer></script>
  <script src="duel-scene.js" defer></script>
</head>
<body class="duel-page">
  <header class="topbar">
    <a class="brand brand-link" href="duel.html"><img src="icons/swords.svg" width="22" height="22" alt=""><span>IRON ARENA <span class="brand-divider">/</span> <span class="brand-section">ONLINE DUEL</span></span></a>
    <nav class="lab-nav" aria-label="项目导航"><a href="/">回声测试</a><a href="board.html">共享画板</a><a href="duel.html" aria-current="page">联机对战</a></nav>
  </header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">03 / ONLINE DUEL</p><h1>铁境竞技场</h1></div><div class="duel-connection"><span id="duel-status" class="status" data-state="connecting" role="status"><span class="status-dot"></span><span id="connection-label">连接中</span></span><button id="reconnect" class="icon-button" aria-label="重新连接" title="重新连接" hidden><img src="icons/plug.svg" width="18" height="18" alt=""></button></div></div>
    <section class="seat-bar" aria-label="玩家席位">
      <span id="identity">观战中</span>
      <form id="join-form"><label for="nickname">昵称</label><input id="nickname" maxlength="16" autocomplete="nickname" placeholder="玩家昵称" required><button id="join" class="button button-teal" disabled>加入对战</button></form>
      <div class="seat-actions"><button id="ready" class="button button-teal" hidden><img src="icons/circle-check.svg" width="17" height="17" alt=""><span>准备</span></button><button id="rematch" class="button button-teal" hidden><img src="icons/rotate-ccw.svg" width="17" height="17" alt=""><span>再战一局</span></button><button id="resign" class="icon-button" title="认输" aria-label="认输" hidden><img src="icons/flag.svg" width="18" height="18" alt=""></button><button id="leave" class="icon-button" title="离开席位" aria-label="离开席位" hidden><img src="icons/log-out.svg" width="18" height="18" alt=""></button></div>
    </section>
    <p id="duel-error" class="error duel-error" role="alert" hidden></p>
    <div class="duel-layout">
      <section class="battle" aria-label="竞技场">
        <div class="battle-state"><span id="phase-label">等待连接</span><span id="turn-number">回合 01</span></div>
        <div class="arena-surface">
          <div class="fighters">
            <div id="fighter-0" class="fighter fighter-green"><div class="fighter-heading"><span class="player-number">P1</span><strong class="fighter-name">等待加入</strong><span class="fighter-presence">空席</span></div><div class="hp-label"><span class="fighter-hp">-- / --</span><span>HP</span></div><div class="hp-track" role="progressbar" aria-label="P1 生命值" aria-valuemin="0" aria-valuemax="180" aria-valuenow="0"><div class="hp-fill"></div></div><div class="fighter-stats"><span class="combat-stats">ATK -- · DEF --</span><span class="guard-status"></span></div></div>
            <div class="versus">VS</div>
            <div id="fighter-1" class="fighter fighter-coral"><div class="fighter-heading"><span class="player-number">P2</span><strong class="fighter-name">等待加入</strong><span class="fighter-presence">空席</span></div><div class="hp-label"><span class="fighter-hp">-- / --</span><span>HP</span></div><div class="hp-track" role="progressbar" aria-label="P2 生命值" aria-valuemin="0" aria-valuemax="180" aria-valuenow="0"><div class="hp-fill"></div></div><div class="fighter-stats"><span class="combat-stats">ATK -- · DEF --</span><span class="guard-status"></span></div></div>
          </div>
          <canvas id="duel-scene" width="1000" height="310" aria-label="双方角色与竞技场动画"></canvas>
          <div class="arena-caption"><span>IRON ARENA</span><span id="arena-outcome">PUBLIC ARENA / 01</span></div>
        </div>
        <div class="action-heading"><h2>战斗行动</h2><span id="action-status" role="status">等待连接</span></div>
        <div class="skill-bar" role="group" aria-label="战斗行动">
          <button class="skill-button" data-action="ATTACK" disabled><img src="icons/sword.svg" width="23" height="23" alt=""><strong>普通攻击</strong><span>100% 攻击</span></button>
          <button class="skill-button" data-action="POWER_STRIKE" disabled><img src="icons/zap.svg" width="23" height="23" alt=""><strong>强力一击</strong><span>180% · 消耗 10 HP</span></button>
          <button class="skill-button" data-action="DRAIN" disabled><img src="icons/heart-pulse.svg" width="23" height="23" alt=""><strong>生命汲取</strong><span id="drain-meta">120% · 汲取 50%</span></button>
          <button class="skill-button" data-action="DEFEND" disabled><img src="icons/shield.svg" width="23" height="23" alt=""><strong>防御</strong><span>下次伤害减半</span></button>
          <button class="skill-button" data-action="POTION" disabled><img src="icons/flask-conical.svg" width="23" height="23" alt=""><strong>治疗药水</strong><span id="potion-meta">恢复 50 HP</span></button>
        </div>
      </section>
      <aside class="battle-log" aria-labelledby="log-heading"><div class="log-heading"><h2 id="log-heading">战斗记录</h2><span id="log-total">0</span></div><ol id="duel-log" role="log" aria-live="polite" aria-relevant="additions" aria-label="战斗记录"></ol><p id="empty-log">暂无战斗记录</p></aside>
    </div>
    <footer class="page-footer"><span>IRON ARENA</span><span>ONLINE DUEL / 03</span></footer>
  </main>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">确认认输？</h2><p id="confirm-description">本局将判定对手获胜。</p><div class="dialog-actions"><button class="button button-cancel" value="cancel" autofocus>取消</button><button id="confirm-command" class="button button-danger" value="confirm">确认</button></div></form></dialog>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>WebSocket Echo | Iron Arena</title>
  <link rel="icon" href="icons/radio.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="board.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/radio.svg" width="22" height="22" alt=""><span>IRON ARENA <span class="brand-divider">/</span> <span class="brand-section">NETWORK LAB</span></span></div>
    <nav class="lab-nav" aria-label="项目导航"><a href="/" aria-current="page">回声测试</a><a href="board.html">共享画板</a><a href="duel.html">联机对战</a></nav>
  </header>
  <main>
    <div class="page-heading">
      <div><p class="eyebrow">连接测试</p><h1>WebSocket Echo</h1></div>
      <span id="status" class="status" data-state="idle" role="status"><span class="status-dot"></span><span id="status-text">未连接</span></span>
    </div>

    <form id="connection-form" class="connection-bar">
      <label for="endpoint">服务地址</label>
      <input id="endpoint" type="url" spellcheck="false" autocomplete="off" aria-describedby="connection-error" required>
      <button id="connect" class="button button-dark" type="submit"><img src="icons/plug.svg" alt="" width="17" height="17"><span id="connect-label">连接</span></button>
    </form>
    <p id="connection-error" class="error" role="alert" hidden></p>

    <section class="metrics" aria-label="消息统计">
      <div class="metric"><span class="metric-label">已发送 <span class="legend-dot sent-dot"></span></span><strong id="sent-count">0</strong><span class="metric-unit">条消息</span></div>
      <div class="metric"><span class="metric-label">已接收 <span class="legend-dot received-dot"></span></span><strong id="received-count">0</strong><span class="metric-unit">条消息</span></div>
      <div class="metric"><span class="metric-label">最近往返</span><strong id="latency">--</strong><span class="metric-unit">ms</span></div>
      <div class="metric endpoint-metric"><span class="metric-label">端点</span><strong>/ws/echo</strong><span class="metric-unit">TEXT · UTF-8</span></div>
    </section>

    <div class="workspace">
      <section class="log-panel" aria-labelledby="log-title">
        <div class="section-heading"><h2 id="log-title">消息记录 <span id="log-count" class="count">0</span></h2><button id="clear" class="icon-button" type="button" aria-label="清空记录" title="清空记录"><img src="icons/trash-2.svg" alt="" width="18" height="18"></button></div>
        <div class="log-surface">
          <div id="empty-log" class="empty-state"><img src="icons/messages-square.svg" width="34" height="34" alt=""><p>暂无消息</p></div>
          <ol id="messages" role="log" aria-label="收发消息记录" aria-live="polite" aria-relevant="additions" tabindex="0"></ol>
        </div>
        <div class="log-footer"><span><i class="legend-dot sent-dot"></i>发送 <i class="legend-dot received-dot"></i>接收 <i class="legend-dot system-dot"></i>连接事件</span><span>最近 200 条</span></div>
      </section>

      <section class="composer-panel" aria-labelledby="composer-title">
        <div class="section-heading"><h2 id="composer-title">发送消息</h2><span class="format-label">TEXT</span></div>
        <form id="message-form">
          <label for="message">消息内容</label>
          <textarea id="message" rows="8" spellcheck="false">你好，竞技场！</textarea>
          <div class="composer-meta"><span>UTF-8</span><span id="byte-count">0 / 4096 字节</span></div>
          <p id="message-error" class="error" role="alert" hidden></p>
          <button id="send" class="button button-teal" type="submit" disabled><span>发送消息</span><img src="icons/send.svg" alt="" width="17" height="17"></button>
        </form>
        <dl class="connection-details"><div><dt>连接状态</dt><dd id="detail-status">未连接</dd></div><div><dt>连接时间</dt><dd id="connected-at">--</dd></div><div><dt>消息上限</dt><dd>4 KB</dd></div></dl>
      </section>
    </div>
    <footer class="page-footer"><span>IRON ARENA</span><span>WebSocket / Echo v0.1.0</span></footer>
  </main>
</body>
</html>
